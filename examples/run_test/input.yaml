inputs:
    energy_files_path: /home/yuxin.chang/fantastx/examples/run_test/inputs/vasp_files/sparse
    model_files_path: /home/yuxin.chang/fantastx/examples/run_test/inputs/init_guess_astrs

structure_record:
    gb:
        init_gb_astr: /home/yuxin.chang/fantastx/examples/run_test/inputs/POSCAR_init_gb
        iface_thickness: 2.35   # For S3 : Thickness of the interface
        iface_z_mid: 0.53       # For S3 : Fractinal coordinate of the midpoint of the interface
        num_slices: 2           # How many slices to make for mating?
        hop_mate_frac: 0.5      # Fraction for choosing basinhopping (hop) versus mating
        sd_true_above: 0.40  # NEW param: z-fractional coords above which sd is True
        sd_true_below: 0.65  # NEW param: z-fractional coords below which sd is True

    max_bond_dist: 4
    min_dist:
      sp1_sp1: 2.2       # minimum bond distance between sp1 and sp1 atoms 
      sp1_sp2: 2.1
      sp2_sp2: 1.9
    species:
        species1:           # sp1 same as in min_dist above.  For S3, roughly 1.5 layers of Al and 1 layer of Si.
            name: Al
            min_num: 6      # Min and max no. of atoms within the interface belonging to sp1
            max_num: 12
            mu: -3.7399515  # Reference chemical potential: Al bulk epa
        species2:
            name: Si
            min_num: 3
            max_num: 8
            mu: -5.425328125  # bulk Si epa

    comp_endpoints: ["Al5Si", "Al3Si5"]     # Endpoints on the compositional axis. The composition of the active region (for gb, it is interface region) is checked to be within this range.

population_limits:
    initial_population: 10   # No. of random models for initial population. Remaining models in total pop will be made using hop and mate
    total_population: 250    # Total no. of models for this run. 
    pool: 30                 # No. of "best" models to consider when creating new child structures


energy_code: vasp       
energy_exec_cmd: mpirun -np 36 vasp_std > job.log 

exp_sim_1: 'GB_STEM'         # What is experimental simulation "1"? i.e., is it PDF or GB-STEM image or XANES etc. 
exp_sim_1_params:            # what are the exp_sim_1 parameters needed for its forward simulation? Following keywords and parameters are the respective forward simulation specific 
   ing_opt_params: [0.055, 0.0, 1.25]
   supercell_dimensions: [1, 2, 1]
   sim_patch_dims:
       x: [18, 152]                # corresponds to width
       y: [120, 280]               # corresponds to height
   resize_sim_img: [134, 155]      # give as [width, height]

select_params:                      # selection parameters -> how to choose parents from the 'pool'
    objective_fn_type: single       # single or multi --> if it is only energy, use 'single' or if it is with energy and some forward simulation, use multi
    #num_required_above_50: 15       # (for multi) The exponent for the exponential distribution for assigning selection probabilities will be optimized as per the no. of models needed to be above 50% probabliltiy (Here given 15 out of 30 in pool)
    #num_models_before_pareto: 20    # (for multi) No. of models to evaluate before attempting pareto front construction. 
    operators: ['perturb_sites', 'perturb_comp', 'fraction_slice'] #possible genetic operations to choose from when creating child structures
    operator_assignment: 'fixed'    # auto-adaptive or fixed : whether to change the selection operation frequencies during the run
    operator_frequencies: [0.25, 0.25, 0.5] # make sure add up to 1, and has same length as 'operators'.

basinhopping_constraints:
    max_perturbation: 0.5           # How much in Å to try to perturb an atom during basinhopping

fingerprint_params:
    label: "bag-of-bonds"           # what fingerprinting method to use 
    tolerance: [0.03, 0.7]          # the given fingerprint specific tlerance for considering equivalent
    zbounds: [8.9 , 16.0]           # [z_low, z_high]. optional parameter which will trim the fingerprinting region of the supercell to be bounded by the provided values.

workers:                            # Slurm or PBS worker job (where VASP jobs run one by one) specifications
    cluster: "PBS"
    submit_queue: "bdwall"
    max_workers: 6
    num_cores: 1
    total_mem: "120GB"
    project_name: "G_FANTASTX"
    node_type: "ib0"
    walltime: "72:00:00"
    processes: 1
    env_extra:
        - "cd $PBS_O_WORKDIR"
        - "module purge"
        - "module add intel-oneapi-compilers/2024.1.0 intel-oneapi-mpi/2021.12.1-oneapi-2024.1.0 intel-oneapi-tbb/2021.12.0-oneapi-2024.1.0 intel-oneapi-mkl/2024.0.0-intel-oneapi-mpi-2021.12.1-oneapi-2024.1.0"
        - "export PATH=/soft/software/custom-built/vasp/5.4.4.pl2/bin:$PATH"
        - "ulimit -s unlimited"
    job_extra:
            - "-l select=1:ncpus=36:mpiprocs=36:mem=112GB"
    job_directives_skip:
            - "-l select=1"

